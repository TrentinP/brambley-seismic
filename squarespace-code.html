<!-- BRAMBLEY RECENT M3+ CAPTURES -->
<div id="brambley-recent-captures" class="brambley-recent-captures">
  <div id="brambley-recent-captures-list"></div>
  <div id="brambley-recent-captures-empty" class="brambley-recent-empty">
    No M3.0+ regional earthquakes from the past seven days have a published Brambley waveform yet.
  </div>
</div>

<style>
  .brambley-recent-captures {
    margin-top: 34px;
  }

  .brambley-recent-card {
    padding: 26px 0 30px;
    border-top: 1px solid rgba(255,255,255,.15);
  }

  .brambley-recent-card:last-child {
    border-bottom: 1px solid rgba(255,255,255,.15);
  }

  .brambley-recent-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 10px 20px;
    margin-bottom: 16px;
    color: #8f9690;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .14em;
  }

  .brambley-recent-title {
    margin: 0 0 8px;
    color: #f1efe7;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(26px, 3vw, 38px);
    font-weight: 400;
    line-height: 1.16;
  }

  .brambley-recent-time {
    margin-bottom: 20px;
    color: #aeb4ae;
    font-size: 12px;
  }

  .brambley-recent-waveform-wrap {
    background: #f2f0e9;
    border: 1px solid rgba(255,255,255,.12);
    overflow: hidden;
  }

  .brambley-recent-waveform {
    display: block;
    width: 100%;
    height: auto;
  }

  .brambley-recent-bottom {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px 20px;
    margin-top: 14px;
    color: #8e958f;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .12em;
  }

  .brambley-recent-bottom a {
    color: #d8dcd6;
    text-decoration: none;
  }

  .brambley-recent-bottom a:hover {
    color: #fff;
  }

  .brambley-recent-empty {
    padding: 24px 0;
    border-top: 1px solid rgba(255,255,255,.15);
    border-bottom: 1px solid rgba(255,255,255,.15);
    color: #9aa09a;
    font-size: 13px;
    line-height: 1.7;
  }
</style>

<script>
(async function () {
  const PAGE_BASE = 'https://TrentinP.github.io/brambley-seismic/';
  const RECENT_URL = PAGE_BASE + 'recent-captures.json';
  const LATEST_URL = PAGE_BASE + 'latest.json';

  const list = document.getElementById('brambley-recent-captures-list');
  const empty = document.getElementById('brambley-recent-captures-empty');

  function formatTime(value) {
    return new Intl.DateTimeFormat(
      'en-US',
      {
        dateStyle: 'long',
        timeStyle: 'short',
        timeZone: 'America/Los_Angeles'
      }
    ).format(new Date(value)) + ' Pacific Time';
  }

  function waveformURL(event) {
    if (event.waveform) {
      return PAGE_BASE + event.waveform.replace(/^\//, '');
    }
    if (event.image) {
      return PAGE_BASE + event.image.replace(/^\//, '');
    }
    return '';
  }

  function render(events) {
    list.innerHTML = '';

    if (!Array.isArray(events) || events.length === 0) {
      empty.hidden = false;
      return;
    }

    empty.hidden = true;

    events.forEach(function (event) {
      const card = document.createElement('article');
      card.className = 'brambley-recent-card';

      const mag = Number(event.magnitude).toFixed(1);
      const image = waveformURL(event);

      card.innerHTML =
        '<div class="brambley-recent-meta">' +
          '<span>RECORDED AT BRAMBLEY</span>' +
          '<span>M3.0+ REGIONAL EVENT</span>' +
        '</div>' +
        '<h3 class="brambley-recent-title">M ' + mag + ' · ' +
          String(event.place || 'Earthquake') + '</h3>' +
        '<div class="brambley-recent-time">' +
          formatTime(event.origin_utc) +
        '</div>' +
        (image
          ? '<div class="brambley-recent-waveform-wrap">' +
              '<img class="brambley-recent-waveform" loading="lazy" ' +
              'alt="Seismogram recorded at Brambley" src="' + image +
              '?v=' + encodeURIComponent(event.origin_utc) + '">' +
            '</div>'
          : '') +
        '<div class="brambley-recent-bottom">' +
          '<span>VERTICAL GROUND MOTION · R1C99 · EHZ</span>' +
          '<a target="_blank" rel="noopener" href="' +
            String(event.usgs_url || '#') + '">VIEW EVENT AT USGS →</a>' +
        '</div>';

      list.appendChild(card);
    });
  }

  try {
    const recentResponse = await fetch(RECENT_URL + '?v=' + Date.now());

    if (recentResponse.ok) {
      const recent = await recentResponse.json();
      if (Array.isArray(recent) && recent.length > 0) {
        render(recent);
        return;
      }
    }
  }
  catch (error) {
    console.warn('Recent Brambley capture feed not available yet.', error);
  }

  /*
   * Transitional fallback: the older latest.json feed already publishes
   * a successfully captured M3.0+ regional event. This keeps the page
   * useful until recent-captures.json has been generated by the new job.
   */
  try {
    const latestResponse = await fetch(LATEST_URL + '?v=' + Date.now());
    if (!latestResponse.ok) {
      render([]);
      return;
    }

    const latest = await latestResponse.json();
    const origin = new Date(latest.origin_utc);
    const ageMs = Date.now() - origin.getTime();
    const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;

    if (Number(latest.magnitude) >= 3.0 && ageMs >= 0 && ageMs <= sevenDaysMs) {
      render([latest]);
    }
    else {
      render([]);
    }
  }
  catch (error) {
    console.error('Unable to load Brambley recorded-event feed:', error);
    render([]);
  }
})();
</script>
