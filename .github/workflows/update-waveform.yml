name: Update Brambley earthquake waveform

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch earthquake and render waveform
        run: python quake_waveform.py

      - name: Commit updated public files
        run: |
          git config user.name "Brambley Observatory"
          git config user.email "actions@users.noreply.github.com"
          git add docs/latest-waveform.png docs/latest.json
          if git diff --cached --quiet; then
            echo "No change to publish."
          else
            git commit -m "Update earthquake waveform"
            git push
          fi
